[package]
name = "xenomit_backpage"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "socks"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2"
tempfile = "3"
zeroize = "1"
